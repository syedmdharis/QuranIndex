name: Build and Deploy
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build
        working-directory: angularapp
        run: |
          npm install
          # Build the app with the correct base-href
          npx ng build --configuration production --base-href /QuranIndex/angularapp
          # Fix: Copy index.html to 404.html so refreshing doesn't break the site
          cp dist/angularapp/index.html dist/angularapp/404.html

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          # This must be exactly where the files are after building
          folder: angularapp/dist/angularapp
