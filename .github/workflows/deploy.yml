name: Build and Deploy
on:
  push:
    branches:
      - main  # Or 'master' if your branch is named that
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          npm install
          npx ng build --configuration production --base-href /QuranIndex/

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/QuranIndex # no /browser folder
