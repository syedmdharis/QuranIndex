name: Build and Deploy
on:
  push:
    branches:
      - master  # Your repo uses 'master' as the main branch
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build 
        working-directory: angularapp
        run: |
          npm install
          # We build inside the subfolder and set the base-href for GitHub Pages
          npx ng build --configuration production --base-href /QuranIndex/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          # This path must match where Angular puts your build files
          folder: angularapp/dist/angularapp
